---
# Root Helmfile - Orchestrates Airflow and MinIO deployments
# K8s cluster with Helm

helmDefaults:
  atomic: false
  cleanupOnFail: false
  recreatePods: false
  force: false

# Add Helm repositories
repositories:
  - name: airflow-stable
    url: https://airflow-helm.github.io/charts
  - name: minio
    url: https://charts.min.io/
  - name: trino
    url: https://trinodb.github.io/charts/
  - name: superset
    url: http://apache.github.io/superset/
  - name: bitnamilegacy
    url: https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami

# Define releases with dependencies
releases:
  # MinIO - Object storage (no dependencies)
  - name: minio
    namespace: minio
    createNamespace: true
    chart: minio/minio
    version: "5.0.14"
    wait: true
    values:
      - minio/custom-values.yaml
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "echo"
        args: ["Deploying MinIO..."]
      - events: ["postsync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "MinIO deployment complete." 
            echo "Creating airflow-logs bucket..."
            kubectl run mc-create-bucket --rm -i --restart=Never \
              --image=minio/mc:latest \
              --namespace=minio \
              --command -- bash -c "
                mc alias set myminio http://minio.minio.svc.cluster.local:9000 admin adminadmin &&
                mc mb myminio/airflow-logs --ignore-existing &&
                echo 'Bucket airflow-logs created successfully'
              "
            echo "Creating bronze bucket..."
            kubectl run mc-create-bucket --rm -i --restart=Never \
              --image=minio/mc:latest \
              --namespace=minio \
              --command -- bash -c "
                mc alias set myminio http://minio.minio.svc.cluster.local:9000 admin adminadmin &&
                mc mb myminio/bronze --ignore-existing &&
                echo 'Bucket bronze created successfully'
              "
            echo "Creating silver bucket..."
            kubectl run mc-create-bucket --rm -i --restart=Never \
              --image=minio/mc:latest \
              --namespace=minio \
              --command -- bash -c "
                mc alias set myminio http://minio.minio.svc.cluster.local:9000 admin adminadmin &&
                mc mb myminio/silver --ignore-existing &&
                echo 'Bucket silver created successfully'
              "
            echo "Creating gold bucket..."
            kubectl run mc-create-bucket --rm -i --restart=Never \
              --image=minio/mc:latest \
              --namespace=minio \
              --command -- bash -c "
                mc alias set myminio http://minio.minio.svc.cluster.local:9000 admin adminadmin &&
                mc mb myminio/gold --ignore-existing &&
                echo 'Bucket gold created successfully'
              "
              
    # PostgreSQL - Metadata store for Trino (depends on nothing)
  - name: postgres
    namespace: postgres
    createNamespace: true
    chart: bitnamilegacy/postgresql
    version: "15.5.38"
    wait: true
    values:
      - postgres/custom-values.yaml
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "echo"
        args: ["Deploying PostgreSQL for Trino metadata..."]
      - events: ["postsync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "PostgreSQL deployment complete."
            echo "Waiting for PostgreSQL to be ready..."
            kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=postgresql -n postgres --timeout=300s
            echo "PostgreSQL is ready!"

  # Apache Airflow - Workflow orchestration (depends on MinIO if configured)
  - name: airflow
    namespace: airflow
    createNamespace: true
    wait: true
    chart: airflow-stable/airflow
    version: "8.9.0"  # Adjust version as needed
    values:
      - airflow/custom-values.yaml
    needs:
      - minio/minio
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "Creating Airflow namespace if not exists..."
            kubectl create namespace airflow --dry-run=client -o yaml | kubectl apply -f -
            echo "Creating GitHub secret from pat.yaml..."
            GITHUB_USERNAME=$(grep "username:" pat.yaml | awk '{print $2}')
            GITHUB_PASSWORD=$(grep "password:" pat.yaml | awk '{print $2}')
            kubectl create secret generic airflow-http-git-secret \
              -n airflow \
              --from-literal=username=$GITHUB_USERNAME \
              --from-literal=password=$GITHUB_PASSWORD \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "Secret created successfully"
      - events: ["postsync"]
        showlogs: true
        command: "echo"
        args: ["Airflow deployment complete"]

  # TrinoDB - SQL query engine (depends on MinIO if configured)
  - name: trino
    namespace: trino
    createNamespace: true
    chart: trino/trino
    version: "1.41.0"
    values:
      - trino/custom-values.yaml
    needs:
      - minio/minio
      - postgres/postgres
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "Creating Trino namespace if not exists..."
            kubectl create namespace trino --dry-run=client -o yaml | kubectl apply -f -
            echo "Creating Superset secret from password.db ..."
            kubectl create secret generic trino-password-authentication \
            --from-file=password.db=./trino/custom-values.yaml \
            -n trino \
            --dry-run=client -o yaml | kubectl apply -f -      
      - events: ["postsync"]
        showlogs: true
        command: "echo"
        args: ["TrinoDB deployment complete"]

  # Apache Superset - BI tool (depends on TrinoDB)
  - name: superset
    namespace: superset
    createNamespace: true
    chart: superset/superset
    version: "0.15.0"
    values:
      - superset/custom-values.yaml
    needs:
      - trino/trino
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "Deploying Superset ..." 
      - events: ["postsync"]
        showlogs: true
        command: "echo"
        args: ["Superset deployment complete"]