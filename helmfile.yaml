---
# Root Helmfile - Orchestrates Airflow and MinIO deployments
# K8s cluster with Helm

helmDefaults:
  atomic: false
  cleanupOnFail: false
  recreatePods: false
  force: false

# Add Helm repositories
repositories:
  - name: airflow-stable
    url: https://airflow-helm.github.io/charts
  - name: minio
    url: https://charts.min.io/
  - name: trino
    url: https://trinodb.github.io/charts/
  - name: superset
    url: http://apache.github.io/superset/
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

# Define releases with dependencies
releases:
  # MinIO - Object storage (no dependencies)
  - name: minio
    namespace: minio
    createNamespace: true
    chart: minio/minio
    version: "5.0.14"
    wait: true
    values:
      - minio/custom-values.yaml
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "echo"
        args: ["Deploying MinIO..."]
      - events: ["postsync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "MinIO deployment complete." 
            echo "Creating airflow-logs bucket..."
            kubectl run mc-create-bucket --rm -i --restart=Never \
              --image=minio/mc:latest \
              --namespace=minio \
              --command -- bash -c "
                mc alias set myminio http://minio.minio.svc.cluster.local:9000 admin adminadmin &&
                mc mb myminio/airflow-logs --ignore-existing &&
                echo 'Bucket airflow-logs created successfully'
              "
            echo "Creating bronze bucket..."
            kubectl run mc-create-bucket --rm -i --restart=Never \
              --image=minio/mc:latest \
              --namespace=minio \
              --command -- bash -c "
                mc alias set myminio http://minio.minio.svc.cluster.local:9000 admin adminadmin &&
                mc mb myminio/bronze --ignore-existing &&
                echo 'Bucket bronze created successfully'
              "
            echo "Creating silver bucket..."
            kubectl run mc-create-bucket --rm -i --restart=Never \
              --image=minio/mc:latest \
              --namespace=minio \
              --command -- bash -c "
                mc alias set myminio http://minio.minio.svc.cluster.local:9000 admin adminadmin &&
                mc mb myminio/silver --ignore-existing &&
                echo 'Bucket silver created successfully'
              "
            echo "Creating gold bucket..."
            kubectl run mc-create-bucket --rm -i --restart=Never \
              --image=minio/mc:latest \
              --namespace=minio \
              --command -- bash -c "
                mc alias set myminio http://minio.minio.svc.cluster.local:9000 admin adminadmin &&
                mc mb myminio/gold --ignore-existing &&
                echo 'Bucket gold created successfully'
              "
    # PostgreSQL - Metadata store for Trino (depends on nothing)
  - name: postgres
    namespace: postgres
    createNamespace: true
    chart: bitnami/postgresql
    version: "18.2.0"
    wait: true
    values:
      - postgres/custom-values.yaml
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "echo"
        args: ["Deploying PostgreSQL for Trino metadata..."]
      - events: ["postsync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "PostgreSQL deployment complete."
            echo "Waiting for PostgreSQL to be ready..."
            kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=postgresql -n postgres --timeout=300s
            echo "PostgreSQL is ready!"
            echo "Granting privileges to trino user and initializing Iceberg schema..."
            kubectl exec -n postgres postgres-postgresql-0 -- \
              env PGPASSWORD=postgres-admin-password \
              psql -U postgres -d iceberg \
              -c "GRANT ALL PRIVILEGES ON DATABASE iceberg TO trino;" \
              -c "GRANT ALL PRIVILEGES ON SCHEMA public TO trino;" \
              -c "ALTER USER trino CREATEDB;" \
              -c "CREATE TABLE IF NOT EXISTS iceberg_tables (catalog_name VARCHAR(255) NOT NULL, table_namespace VARCHAR(255) NOT NULL, table_name VARCHAR(255) NOT NULL, metadata_location VARCHAR(1000), previous_metadata_location VARCHAR(1000), PRIMARY KEY (catalog_name, table_namespace, table_name));" \
              -c "CREATE TABLE IF NOT EXISTS iceberg_namespace_properties (catalog_name VARCHAR(255) NOT NULL, namespace VARCHAR(255) NOT NULL, property_key VARCHAR(255), property_value VARCHAR(1000), PRIMARY KEY (catalog_name, namespace, property_key));" \
              -c "ALTER TABLE iceberg_tables OWNER TO trino;" \
              -c "ALTER TABLE iceberg_namespace_properties OWNER TO trino;" \
              -c "GRANT ALL PRIVILEGES ON TABLE iceberg_tables TO trino;" \
              -c "GRANT ALL PRIVILEGES ON TABLE iceberg_namespace_properties TO trino;"
            echo "Iceberg schema initialized successfully!"

  # Apache Spark - Distributed processing
  - name: spark
    namespace: spark
    createNamespace: true
    chart: bitnami/spark
    version: "6.6.3"
    wait: true
    values:
      - spark/custom-values.yaml
    needs:
      - minio/minio
      - postgres/postgres
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "Creating spark-jobs ConfigMap from local jobs folder..."
            kubectl create namespace spark --dry-run=client -o yaml | kubectl apply -f -
            kubectl create configmap spark-jobs \
              --from-file=spark/jobs/ \
              -n minio \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "ConfigMap created!"
      - events: ["postsync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "Spark deployment complete."
            echo "Waiting for Spark to be ready..."
            kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=spark -n spark --timeout=600s
            echo "Spark is ready!"
            echo "Uploading Spark jobs to MinIO..."
            kubectl run mc-upload-jobs --rm -i --restart=Never \
              --image=minio/mc:latest \
              --namespace=minio \
              --overrides='{
                "spec": {
                  "volumes": [{
                    "name": "jobs",
                    "configMap": {"name": "spark-jobs"}
                  }],
                  "containers": [{
                    "name": "mc-upload-jobs",
                    "image": "minio/mc:latest",
                    "command": ["bash", "-c"],
                    "args": ["mc alias set myminio http://minio.minio.svc.cluster.local:9000 admin adminadmin && mc cp /jobs/ myminio/job/ --recursive && echo Jobs uploaded successfully"],
                    "volumeMounts": [{"name": "jobs", "mountPath": "/jobs"}]
                  }]
                }
              }'
            echo "Jobs uploaded!"
  # Apache Airflow - Workflow orchestration (depends on MinIO if configured)
  - name: airflow
    namespace: airflow
    createNamespace: true
    wait: true
    chart: airflow-stable/airflow
    version: "8.9.0"  # Adjust version as needed
    values:
      - airflow/custom-values.yaml
    needs:
      - minio/minio
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "Creating Airflow namespace if not exists..."
            kubectl create namespace airflow --dry-run=client -o yaml | kubectl apply -f -
            echo "Creating GitHub secret from pat.yaml..."
            GITHUB_USERNAME=$(grep "username:" pat.yaml | awk '{print $2}')
            GITHUB_PASSWORD=$(grep "password:" pat.yaml | awk '{print $2}')
            kubectl create secret generic airflow-http-git-secret \
              -n airflow \
              --from-literal=username=$GITHUB_USERNAME \
              --from-literal=password=$GITHUB_PASSWORD \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "Secret created successfully"
      - events: ["postsync"]
        showlogs: true
        command: "echo"
        args: ["Airflow deployment complete"]

  # TrinoDB - SQL query engine (depends on MinIO if configured)
  - name: trino
    namespace: trino
    createNamespace: true
    chart: trino/trino
    version: "1.41.0"
    values:
      - trino/custom-values.yaml
    needs:
      - minio/minio
      - postgres/postgres
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "Creating Trino namespace if not exists..."
            kubectl create namespace trino --dry-run=client -o yaml | kubectl apply -f -
            echo "Creating Superset secret from password.db ..."
            kubectl create secret generic trino-password-authentication \
            --from-file=password.db=./trino/custom-values.yaml \
            -n trino \
            --dry-run=client -o yaml | kubectl apply -f -      
      - events: ["postsync"]
        showlogs: true
        command: "echo"
        args: ["TrinoDB deployment complete"]

  # Apache Superset - BI tool (depends on TrinoDB)
  - name: superset
    namespace: superset
    createNamespace: true
    chart: superset/superset
    version: "0.15.0"
    values:
      - superset/custom-values.yaml
    needs:
      - trino/trino
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            echo "Deploying Superset ..." 
      - events: ["postsync"]
        showlogs: true
        command: "echo"
        args: ["Superset deployment complete"]
      - events: ["postsync"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - |
            set -e

            echo "Waiting for Superset deployment to be ready..."
            kubectl rollout status deploy/superset -n superset --timeout=300s

            echo "Creating dashboards ConfigMap..."
            kubectl create configmap superset-dashboards \
              --from-file=superset/dashboards/ \
              -n superset \
              --dry-run=client -o yaml | kubectl apply -f -

            echo "Getting Superset pod name..."
            SUPERSET_POD=$(kubectl get pods -n superset \
              -l app=superset \
              -o jsonpath="{.items[?(@.status.phase=='Running')].metadata.name}" | head -n 1)

            echo "Superset pod: $SUPERSET_POD"

            echo "Copying dashboards into Superset pod..."
            kubectl cp superset/dashboards/. superset/$SUPERSET_POD:/tmp/dashboards

            echo "Importing dashboards..."
            kubectl exec -n superset $SUPERSET_POD -- bash -c '
              for file in /tmp/dashboards/*.zip; do
                echo "Importing $file"
                superset import-dashboards -p $file -u admin
              done
            '

            echo "Dashboard import completed successfully."